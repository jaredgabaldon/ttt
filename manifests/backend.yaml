###########################
# Backend Deployment
###########################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teris-backend-deployment
  labels:
    app: teris-backend
spec:
  # Keep one replica while migrations run during container startup.
  replicas: 1
  selector:
    matchLabels:
      app: teris-backend
  template:
    metadata:
      labels:
        app: teris-backend
    spec:
      containers:
        - name: teris-backend
          image: jaredgabaldon/teris-toys-and-trinkets-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          command: ["sh", "-c"]
          args:
            - |
              set -eux
              echo "Running Django migrations"
              python manage.py migrate --noinput
              echo "Collecting static assets"
              python manage.py collectstatic --noinput --verbosity 2
              echo "Starting Gunicorn on :8000"
              exec gunicorn collector_shop.wsgi:application --bind 0.0.0.0:8000
          envFrom:
            - configMapRef:
                name: teris-backend-config
            - secretRef:
                name: teris-backend-secret
          # Explicit values override the old database credentials in envFrom.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: teris-postgres-app-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teris-postgres-app-credentials
                  key: POSTGRES_PASSWORD
          # Allow migrations and collectstatic to finish before liveness checks begin.
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30

---
###########################
# Backend Cluster IP Service
###########################
apiVersion: v1
kind: Service
metadata:
  name: teris-backend-service
  labels:
    app: teris-backend
spec:
  type: ClusterIP
  selector:
    app: teris-backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
