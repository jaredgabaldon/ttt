###########################
# Backend Config
###########################
apiVersion: v1
kind: ConfigMap
metadata:
  name: teris-backend-config
  labels:
    app: teris-backend
data:
  DJANGO_ALLOWED_HOSTS: "teristoysandtrinkets.com"
  DJANGO_DEBUG: "false"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://teristoysandtrinkets.com"
  POSTGRES_HOST: "teris-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "defaultdb"
  POSTGRES_SSLMODE: "disable"
  AWS_STORAGE_BUCKET_NAME: "power-bucket"
  AWS_S3_REGION_NAME: "sfo3"
  AWS_S3_ENDPOINT_URL: "https://sfo3.digitaloceanspaces.com"
  AWS_LOCATION: "ttt/media"
  SPACES_BACKUP_PREFIX: "ttt/database-backups/postgres/"
  AWS_DEFAULT_ACL: "public-read"
